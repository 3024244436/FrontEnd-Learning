<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>网页标题</h1>
    <!-- 网页标题分级，并且自动换行 -->
     <p><strong>这是一个段落内容</strong></p>
     <!-- 注意两个段落内容中间会自动换行 -->
     <p><strong>这是另一个段落内容</strong></p>
    <h2>二级标题</h2>
    <h3>三级标题</h3>
    <!-- 一般h1标题只用一次 -->
</body>
</html>
