<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <!--注释是这种格式-->
    <!-- ctrl 加 /同时按是注释快捷键 -->
    <strong>注释</strong>：注释是用来解释代码的，注释不会被浏览器解析执行，所以注释的内容不会显示在页面上。注释可以帮助我们更好地理解代码，注释也可以帮助我们在调试代码时快速定位问题。
</body>
</html>
