<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多种标签类型</title>
</head>
<body>
    <!-- 换行标签，中间加换行标签表示换行 -->
    第一行内容
    <br>
    第二行内容
    <hr>
    <!-- hr水平线标签，表示分割线 -->
    <p>这是一个段落标签，表示一段文本内容。</p>

    <em>倾斜标签</em>
    <!-- i标签也是倾斜标签 -->
    <br>
    <ins>下划线标签</ins>
    <!-- u标签也是下划线标签 -->
    <br>
    <del>删除线标签</del>
    <!-- 图像标签 -->
    <br>

    <!-- 快捷键：输入img之后按回车 -->
    <!--按下./之后可以浏览文件夹内的所有图片  -->
    <img src="./image/note/1779786063519.png" alt="图片描述">
    <br>
    <!-- alt属性：图片出错时显示alt的文字 -->
    <img src="./示例图片.jpg" alt="图片出错">
    <br>
    <!-- 提示属性title，鼠标悬停可以显示文字 -->
    <img src = "image/note/1779787523617.png" title = "学习笔记">

    <!-- 超链接标签 -->
    <a href = "https://www.tju.edu.cn/"><strong>天津大学官网</strong></a>
    <br>
    <!-- 超链接也可以跳转到本地文件 -->
    <a href = "./3-标签的父子关系.html"><strong>标签的父子关系</strong></a>
    <!-- 输入./快捷键 -->
    <!--超链接属性  -->
    <hr>
    <a href = "https://leetcode.cn/" target = "_blank"><strong>LeetCode</strong></a>
    <!-- target属性：_blank在新标签页打开链接 -->

    <br>
    <!-- 音频标签 -->
    <p><strong>周杰伦《说了再见》</strong></p>
    <audio src = "G:/周杰伦歌曲白嫖/说了再见.aac" controls></audio>
    <p><strong>高清MV在线播放</strong></p>
    <video src = "G:/周杰伦歌曲白嫖/说了再见MV.mp4" controls></video>
     <!-- video标签：视频标签，src属性指定视频文件路径，controls属性显示控制面板 -->

    <hr>
     <!-- 在一行文本中添加网站超链接 -->
    <p>如想知道更多信息，请访问<a href = "https://www.tju.edu.cn/" target = "_blank">天津大学官网</a></p>
</body>
</html>
